<style>
    @font-face {
        font-family:'Noto Sans';
        font-weight:400;
        font-style:normal;
        src:url("../fonts/Noto-Sans-regular/Noto-Sans-regular.eot");
        src:url("../fonts/Noto-Sans-regular/Noto-Sans-regular.eot?#iefix") format("embedded-opentype"),
        local("Noto Sans"),
        local("Noto-Sans-regular"),
        url("../fonts/Noto-Sans-regular/Noto-Sans-regular.woff2") format("woff2"),
        url("../fonts/Noto-Sans-regular/Noto-Sans-regular.woff") format("woff"),
        url("../fonts/Noto-Sans-regular/Noto-Sans-regular.ttf") format("truetype"),
        url("../fonts/Noto-Sans-regular/Noto-Sans-regular.svg#NotoSans") format("svg")
    }
    :root {
        color-scheme: dark;

        --g-10: oklch(16% 0.005 265);
        --on-surface: oklch(80% 0.005 265);
        --on-surface-strong: oklch(96% 0.003 265);
        --accent: oklch(83% 0.035 245);
        --accent-bright: oklch(92% 0.03 245);
        --glass-border: oklch(100% 0 0 / 0.09);
        --radius-m: 12px;
    }

    /* opaque graphite standalone, transparent when framed by the shell */
    html {
        background-color: var(--g-10);
    }

    body {
        margin: 0;
        background-color: transparent;
        scrollbar-width: thin;
        scrollbar-color: oklch(100% 0 0 / 0.16) transparent;
    }

    article {
        background-color: transparent;
        padding: 14px 22px 28px;
        font: 14px/1.6 "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    article p {
        color: var(--on-surface);
        font-weight: 400;
    }
    h3, h4, h5, h6 {
        color: var(--on-surface-strong);
    }
    h3 {
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 12pt;
    }
    a {
        color: var(--accent);
        text-decoration: none;
    }
    a:hover,
    a:focus {
        color: var(--accent-bright);
    }

    /* monochrome icons are authored dark — flip them for the graphite surface */
    .link-icon {
        vertical-align: text-bottom;
        filter: invert(1);
        opacity: 0.85;
    }

    .screenshot {
        max-width: 100%;
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-m);
        box-shadow: 0 2px 6px oklch(0% 0 0 / 0.4), 0 14px 38px oklch(0% 0 0 / 0.35);
    }

    .note {
        color: var(--on-surface);
    }
</style>
